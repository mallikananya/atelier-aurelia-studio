name: atelier-aurelia-studio

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-atelier-aurelia-artifacts}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set a separate MinIO runtime user in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set a separate MinIO runtime password in .env}
    volumes:
      - ./artifact-runtime-policy.json:/policies/artifact-runtime-policy.json:ro
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        case "$${OBJECT_STORAGE_BUCKET}" in
          ''|*[!a-z0-9.-]*) echo 'Invalid artifact bucket name' >&2; exit 1;;
        esac
        if [ "$${AWS_ACCESS_KEY_ID}" = "$${MINIO_ROOT_USER}" ]; then
          echo 'Runtime credentials must differ from MinIO administration credentials' >&2
          exit 1
        fi
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}"
        mc version enable "local/$${OBJECT_STORAGE_BUCKET}"
        mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}"
        policy=$$(while IFS= read -r line; do printf '%s\n' "$$line"; done < /policies/artifact-runtime-policy.json)
        printf '%s%s%s\n' "$${policy%%ARTIFACT_BUCKET*}" "$${OBJECT_STORAGE_BUCKET}" "$${policy#*ARTIFACT_BUCKET}" > /tmp/artifact-runtime-policy.json
        mc admin policy create local artifact-runtime /tmp/artifact-runtime-policy.json
        mc admin user add local "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}"
        mc admin policy attach local artifact-runtime --user "$${AWS_ACCESS_KEY_ID}"

volumes:
  minio-data:
